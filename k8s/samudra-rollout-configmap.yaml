apiVersion: v1
kind: ConfigMap
metadata:
  name: samudra-rollout-config
  namespace: climate-analytics
data:
  rollout_samudra_om4.yaml: |
    debug: false
    save_zarr: true
    disk_mode: true
    inference:
      start_time: "2014-09-30"
      end_time: "2022-12-24"
    ckpt_path: /data/samudra/weights/samudra_thermo_dynamic_seed1.pt
    num_model_steps_forward: 20
    record_every: 10

    experiment:
      name: rollout
      sub_name: om4_samudra
      rand_seed: 5
      base_output_dir: /data/samudra/rollout
      data_dir: /data/samudra
      network: samudra
      prognostic_vars_key: thermo_dynamic
      boundary_vars_key: hfds_anom

    data:
      data_path: data
      data_means_path: stats/means.zarr
      data_stds_path: stats/stds.zarr
      time_delta: 5
      num_workers: 4
      hist: 1

    unet:
      ch_width: [158, 200, 250, 300, 400]
      n_out: 154
      dilation: [1, 2, 4, 8]
      n_layers: [1, 1, 1, 1]
      last_kernel_size: 3
      pad: "circular"

      core_block:
        block_type: "conv_next_block"
        kernel_size: 3
        activation: "capped_gelu"
        upscale_factor: 4
        norm: "batch"

      down_sampling_block: "avg_pool"
      up_sampling_block: "bilinear_upsample"
