apiVersion: v1
kind: ConfigMap
metadata:
  name: samudra-train-config
  namespace: climate-analytics
data:
  train_samudra_om4.yaml: |
    debug: false
    disk_mode: true
    pin_mem: true
    save_freq: 55
    epochs: 70
    batch_size: 4
    learning_rate: 0.0002
    scheduler: true
    loss: mse
    inference_epochs: [-1]
    # Ranges must align with times present in /data/samudra/data (eval subset is often
    # ~2014-10-10–2022-12-24; do not use 2014-01–2014-09 or inference window is empty).
    train:
      start_time: "2014-10-10"
      end_time: "2019-12-31"
    val:
      start_time: "2020-01-01"
      end_time: "2021-12-31"
    inference:
      - start_time: "2022-01-01"
        end_time: "2022-12-24"
    data_stride: [1]
    steps: [4]
    step_transition: []

    distributed:
      enabled: true

    experiment:
      name: train
      sub_name: om4_samudra
      rand_seed: 5
      base_output_dir: /data/samudra/train
      data_dir: /data/samudra
      network: samudra
      prognostic_vars_key: thermo_dynamic
      boundary_vars_key: hfds_anom

    data:
      data_path: data
      data_means_path: stats/means.zarr
      data_stds_path: stats/stds.zarr
      time_delta: 5
      num_workers: 4
      hist: 1

    unet:
      ch_width: [158, 200, 250, 300, 400]
      n_out: 154
      dilation: [1, 2, 4, 8]
      n_layers: [1, 1, 1, 1]
      last_kernel_size: 3
      pad: "circular"

      core_block:
        block_type: "conv_next_block"
        kernel_size: 3
        activation: "capped_gelu"
        upscale_factor: 4
        norm: "batch"

      down_sampling_block: "avg_pool"
      up_sampling_block: "bilinear_upsample"
